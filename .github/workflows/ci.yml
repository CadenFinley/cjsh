name: CI Build and Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            architectures: x86_64
            verify_architectures: x86_64
            architecture_count: 1
            deployment_target: "12.0"
          - target: macos-arm64
            runner: macos-15
            architectures: arm64
            verify_architectures: arm64
            architecture_count: 1
            deployment_target: "15.0"
          - target: macos-universal2
            runner: macos-15
            architectures: "x86_64;arm64"
            verify_architectures: "x86_64 arm64"
            architecture_count: 2
            deployment_target: "12.0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure
        env:
          OSX_ARCHITECTURES: ${{ matrix.architectures }}
          OSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          cmake --preset release-artifact \
            -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCHITECTURES" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$OSX_DEPLOYMENT_TARGET"

      - name: Build
        run: cmake --build --preset release-artifact --parallel

      - name: Run all tests in parallel
        run: ctest --preset release-artifact --parallel 4

      - name: Verify Mach-O architectures and minimum macOS version
        env:
          EXPECTED_ARCHITECTURES: ${{ matrix.verify_architectures }}
          EXPECTED_ARCHITECTURE_COUNT: ${{ matrix.architecture_count }}
          EXPECTED_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          set -euo pipefail
          binary=build/release-artifact/cjsh
          read -r -a expected_architectures <<< "$EXPECTED_ARCHITECTURES"
          lipo "$binary" -verify_arch "${expected_architectures[@]}"
          architecture_count=$(lipo -archs "$binary" | wc -w | tr -d ' ')
          if [[ "$architecture_count" != "$EXPECTED_ARCHITECTURE_COUNT" ]]; then
            echo "Expected $EXPECTED_ARCHITECTURE_COUNT Mach-O slices, found $architecture_count" >&2
            exit 1
          fi
          minimum_versions=$(otool -arch all -l "$binary" | awk '$1 == "minos" { print $2 }' | sort -u)
          if [[ "$minimum_versions" != "$EXPECTED_DEPLOYMENT_TARGET" ]]; then
            echo "Expected macOS $EXPECTED_DEPLOYMENT_TARGET minimum, found: $minimum_versions" >&2
            exit 1
          fi
          file "$binary"

  build-linux-gnu:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-gnu-x86_64
            runner: ubuntu-22.04
            machine: x86_64
          - target: linux-gnu-arm64
            runner: ubuntu-22.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure
        run: cmake --preset release-artifact

      - name: Build
        run: cmake --build --preset release-artifact --parallel

      - name: Run all tests in parallel
        run: ctest --preset release-artifact --parallel 4

      - name: Verify glibc ELF binary
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          binary=build/release-artifact/cjsh
          if [[ "$(uname -m)" != "$EXPECTED_MACHINE" ]]; then
            echo "Expected runner architecture $EXPECTED_MACHINE, found $(uname -m)" >&2
            exit 1
          fi
          interpreter=$(readelf -l "$binary" | sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p')
          if [[ "$interpreter" != *ld-linux* ]]; then
            echo "Expected a glibc dynamic loader, found: $interpreter" >&2
            exit 1
          fi
          file "$binary"
          ldd "$binary"

  build-windows-wsl:
    name: Test windows-wsl2-ubuntu-24.04-x86_64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: wsl-bash_Ubuntu-24.04 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ubuntu in WSL 2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          wsl-shell-user: cjsh-test
          additional-packages: build-essential cmake ninja-build python3 git file binutils procps

      - name: Prepare source in the Linux filesystem
        run: |
          test "$(id -u)" -ne 0
          # A Linux checkout preserves executable bits and LF line endings, and
          # keeps permission-sensitive tests off the Windows-mounted filesystem.
          # The Windows checkout has a different owner. Trust it in the WSL
          # user's config so clone's upload-pack subprocess sees the exception.
          git config --global --add safe.directory "$PWD"
          git config --global --add safe.directory "$PWD/.git"
          source_commit=$(git rev-parse HEAD)
          git clone --no-hardlinks \
            -c core.autocrlf=false "$PWD" "$HOME/cjsh"
          git -C "$HOME/cjsh" checkout --detach "$source_commit"

      - name: Configure
        run: |
          cd "$HOME/cjsh"
          cmake --preset release-artifact

      - name: Build
        run: |
          cd "$HOME/cjsh"
          cmake --build --preset release-artifact --parallel

      - name: Run all tests in parallel
        run: |
          cd "$HOME/cjsh"
          ctest --preset release-artifact --parallel 4

      - name: Verify WSL environment and Linux binary
        run: |
          cd "$HOME/cjsh"
          uname -a
          grep -qi microsoft /proc/sys/kernel/osrelease
          test "$(uname -m)" = x86_64
          binary=build/release-artifact/cjsh
          "$binary" --version
          file "$binary"
          ldd "$binary"

  build-linux-musl:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-musl-x86_64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            machine: x86_64
          - target: linux-musl-arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and test static musl binary
        env:
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            --cap-add MKNOD \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e EXPECTED_MACHINE \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            alpine:3.22 \
            sh -euxc '
              apk add --no-cache bash binutils build-base cmake coreutils file findutils git grep linux-headers ninja procps python3 sed su-exec
              adduser -D -u 1000 cjsh-test
              install -d -o cjsh-test -g cjsh-test /tmp/cjsh-tests
              mknod /dev/cjsh-test-block b 7 0
              git config --global --add safe.directory /work
              cmake --preset release-static
              cmake --build --preset release-static --parallel
              # CTest writes logs and test fixtures inside the root-built tree.
              chown -R cjsh-test:cjsh-test build/release-static
              su-exec cjsh-test env HOME=/home/cjsh-test CJSH_TEST_SKIP_PRELOAD_INJECTION=1 ctest --preset release-static --parallel 4 -E "^build_system_configuration_tests$"
              test "$(uname -m)" = "$EXPECTED_MACHINE"
              readelf -l build/release-static/cjsh > build/release-static/program-headers.txt
              if grep -q " INTERP " build/release-static/program-headers.txt; then
                echo "musl release binary unexpectedly contains a dynamic interpreter" >&2
                exit 1
              fi
              file build/release-static/cjsh
            '

  build-minimal:
    name: Linux Minimal Preset
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure
        run: cmake --preset minimal

      - name: Build
        run: cmake --build --preset minimal --parallel

      - name: Run all tests in parallel
        run: ctest --preset minimal --parallel 4
